/* ---------------- Toast system ---------------- */

function useToasts() {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((message, kind = "success") => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, message, kind }]);
    setTimeout(() => {
      setToasts((t) => t.filter((x) => x.id !== id));
    }, 3200);
  }, []);
  return { toasts, push };
}

function ToastStack({ toasts }) {
  return (
    <div className="toast-stack" aria-live="polite">
      {toasts.map((t) => (
        <div key={t.id} className={`toast toast-${t.kind}`}>
          <span className="toast-icon">
            <Icon name="check" size={16} />
          </span>
          {t.message}
        </div>
      ))}
    </div>
  );
}

/* ---------------- App shell / routing (simple internal router) ---------------- */

function App() {
  const [route, setRoute] = useState({ name: "home" });
  const [cart, setCart] = useState([]); // {id, qty}
  const [cartOpen, setCartOpen] = useState(false);
  const [mobileMenuOpen, setMobileMenuOpen] = useState(false);
  const { toasts, push } = useToasts();
  const scrollRef = useRef(null);

  const navigate = useCallback((r) => {
    setRoute(r);
    setMobileMenuOpen(false);
    window.scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
  }, []);

  const addToCart = useCallback(
    (id) => {
      setCart((prev) => {
        const existing = prev.find((c) => c.id === id);
        if (existing) {
          return prev.map((c) => (c.id === id ? { ...c, qty: c.qty + 1 } : c));
        }
        return [...prev, { id, qty: 1 }];
      });
      const item = ALL_ITEMS.find((p) => p.id === id);
      push(`تمت إضافة «${item?.name}» إلى السلة`, "success");
    },
    [push]
  );

  const updateQty = useCallback((id, delta) => {
    setCart((prev) =>
      prev
        .map((c) => (c.id === id ? { ...c, qty: Math.max(0, c.qty + delta) } : c))
        .filter((c) => c.qty > 0)
    );
  }, []);

  const removeFromCart = useCallback((id) => {
    setCart((prev) => prev.filter((c) => c.id !== id));
  }, []);

  const cartCount = cart.reduce((sum, c) => sum + c.qty, 0);
  const cartItems = cart
    .map((c) => {
      const item = ALL_ITEMS.find((p) => p.id === c.id);
      const price = item ? (item.priceNum ?? item.price) : 0;
      return item ? { ...item, qty: c.qty, unitPrice: price } : null;
    })
    .filter(Boolean);
  const cartTotal = cartItems.reduce((sum, c) => sum + c.unitPrice * c.qty, 0);

  return (
    <div className="app" dir="rtl">
      <GlobalStyles />
      <SkipLink />
      <Header
        route={route}
        navigate={navigate}
        cartCount={cartCount}
        onOpenCart={() => setCartOpen(true)}
        mobileMenuOpen={mobileMenuOpen}
        setMobileMenuOpen={setMobileMenuOpen}
      />
      <main id="main-content">
        {route.name === "home" && <HomePage navigate={navigate} addToCart={addToCart} />}
        {route.name === "products" && (
          <ProductsPage navigate={navigate} addToCart={addToCart} initialQuery={route.query} />
        )}
        {route.name === "product" && (
          <ProductDetailPage
            id={route.id}
            navigate={navigate}
            addToCart={addToCart}
            openCart={() => setCartOpen(true)}
          />
        )}
        {route.name === "services" && <ServicesPage navigate={navigate} />}
        {route.name === "service" && (
          <ServiceDetailPage id={route.id} navigate={navigate} push={push} />
        )}
        {route.name === "events" && <EventsPage navigate={navigate} />}
        {route.name === "event" && <EventDetailPage id={route.id} navigate={navigate} />}
        {route.name === "about" && <AboutPage />}
        {route.name === "contact" && <ContactPage push={push} />}
        {route.name === "checkout" && (
          <CheckoutPage
            cartItems={cartItems}
            cartTotal={cartTotal}
            navigate={navigate}
            push={push}
            clearCart={() => setCart([])}
          />
        )}
      </main>
      <Footer navigate={navigate} />
      <CartDrawer
        open={cartOpen}
        onClose={() => setCartOpen(false)}
        items={cartItems}
        total={cartTotal}
        updateQty={updateQty}
        removeFromCart={removeFromCart}
        navigate={navigate}
      />
      <ToastStack toasts={toasts} />
    </div>
  );
}

      list = list.filter(

                <div className="summary-row" key={it.id}>
                  <span>
                    {it.name} × {it.qty}
                  </span>

                </div>
              ))}
              <div className="summary-row summary-total">

}

/* ---------------- Modal ---------------- */

function Modal({ children, onClose, title }) {
  useEffect(() => {
    const onKey = (e) => e.key === "Escape" && onClose();
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, [onClose]);

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div
        className="modal-panel"
        role="dialog"
        aria-modal="true"
        aria-label={title}
        onClick={(e) => e.stopPropagation()}
      >
        <div className="modal-head">
          <h2>{title}</h2>
          <button className="icon-btn" onClick={onClose} aria-label="إغلاق">
            <Icon name="close" size={20} />
          </button>
        </div>
        <div className="modal-body">{children}</div>
      </div>
    </div>
  );
}

      }
      .success-panel h3 { font-size: 1.2rem; color: var(--navy); margin-bottom: 8px; }
      .success-panel p { color: var(--muted); margin-bottom: 20px; font-size: 0.95rem; }

      /* ---------- Cart drawer ---------- */
      .drawer-overlay {
        position: fixed;
        inset: 0;
        background: rgba(11, 23, 48, 0.4);
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.2s ease;
        z-index: 150;
      }
      .drawer-overlay.is-open { opacity: 1; pointer-events: auto; }

      .cart-drawer {
        position: fixed;
        top: 0;
        right: 0;
        height: 100%;
        width: 400px;
        max-width: 92vw;
        background: #fff;
        z-index: 151;
        display: flex;
        flex-direction: column;
        transform: translateX(100%);
        transition: transform 0.25s ease;
        box-shadow: -12px 0 32px rgba(11, 23, 48, 0.12);
      }
      .cart-drawer.is-open { transform: translateX(0); }

      .drawer-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 22px;
        border-bottom: 1px solid var(--line);
      }
      .drawer-head h2 { font-size: 1.15rem; }

      .cart-empty {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: var(--muted);
        padding: 20px;
      }

      .cart-items { flex: 1; overflow-y: auto; padding: 14px 18px; display: flex; flex-direction: column; gap: 14px; }
      .cart-item {
        display: flex;
        gap: 12px;
        align-items: flex-start;
        padding: 12px;
        background: var(--bg);
        border-radius: var(--radius-sm);
      }
      .cart-item-icon {
        width: 52px;
        height: 52px;
        border-radius: 10px;
        overflow: hidden;
        flex-shrink: 0;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--blue);
      }
      .cart-item-art { width: 100%; height: 100%; }
      .cart-item-info { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
      .cart-item-name { font-weight: 700; font-size: 0.9rem; color: var(--navy); line-height: 1.4; }
      .cart-item-price { font-size: 0.85rem; color: var(--muted); font-weight: 600; }
      .qty-control { display: flex; align-items: center; gap: 10px; margin-top: 4px; }
      .qty-btn {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: #fff;
        border: 1px solid var(--line);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--navy);
      }
      .qty-btn:hover { border-color: var(--blue); color: var(--blue); }
      .qty-value { font-weight: 700; min-width: 18px; text-align: center; }
      .cart-item-remove { color: var(--muted); padding: 4px; flex-shrink: 0; }
      .cart-item-remove:hover { color: #C0392B; }

      .cart-foot { padding: 18px 22px 22px; border-top: 1px solid var(--line); }
      .cart-total-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-weight: 700;
        font-size: 1.05rem;
        margin-bottom: 16px;
        color: var(--navy);
      }
      .cart-total-value { color: var(--blue); font-size: 1.2rem; }

      /* ---------- Checkout ---------- */
      .checkout-banner {
        background: rgba(63, 166, 232, 0.1);
        border: 1px solid rgba(63, 166, 232, 0.3);
        color: var(--navy);
        padding: 12px 18px;
        border-radius: var(--radius-sm);
        font-size: 0.92rem;
        font-weight: 600;
        margin-bottom: 32px;
      }
      .checkout-layout { display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: start; }
      @media (max-width: 900px) { .checkout-layout { grid-template-columns: 1fr; } }
      .order-summary {
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 24px;
        position: sticky;
        top: 96px;
      }
      .summary-row { display: flex; justify-content: space-between; padding: 10px 0; font-size: 0.92rem; color: var(--muted); border-bottom: 1px solid var(--line); }
      .summary-total { border-bottom: none; font-weight: 800; color: var(--navy); font-size: 1.05rem; padding-top: 14px; }
      .checkout-success { max-width: 480px; margin: 0 auto; padding: 60px 20px; }

      /* ---------- Modal ---------- */
      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(11, 23, 48, 0.45);
        z-index: 200;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        animation: fadeIn 0.15s ease;
      }
      @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
      .modal-panel {
        background: #fff;
        border-radius: var(--radius);
        max-width: 520px;
        width: 100%;
        max-height: 88vh;
        overflow-y: auto;
        animation: modalIn 0.2s ease;
      }
      @keyframes modalIn { from { opacity: 0; transform: translateY(10px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
      .modal-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 24px;
        border-bottom: 1px solid var(--line);
      }
      .modal-head h2 { font-size: 1.1rem; }
      .modal-body { padding: 24px; }

      /* ---------- Toasts ---------- */
      .toast-stack {
        position: fixed;
        bottom: 24px;
        left: 24px;
        z-index: 300;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .toast {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--navy);
        color: #fff;
        padding: 13px 18px;
        border-radius: 12px;
        font-weight: 600;
        font-size: 0.9rem;
        box-shadow: 0 8px 24px rgba(11, 23, 48, 0.25);
        animation: toastIn 0.25s ease;
        max-width: 320px;
      }
      @keyframes toastIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      .toast-icon {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: rgba(255,255,255,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }

      /* ---------- Footer ---------- */
      .site-footer {
        background: var(--navy);
        color: rgba(255,255,255,0.85);
        margin-top: 40px;
      }
      .footer-inner {
        max-width: 1240px;
        margin: 0 auto;
        padding: 48px 24px 32px;
        display: flex;
        justify-content: space-between;
        gap: 40px;
        flex-wrap: wrap;
      }
      .footer-brand { max-width: 340px; }
      .footer-logo { height: 40px; filter: brightness(0) invert(1); opacity: 0.95; margin-bottom: 14px; }
      .footer-blurb { font-size: 0.9rem; line-height: 1.7; color: rgba(255,255,255,0.65); }
      .footer-nav { display: flex; flex-wrap: wrap; gap: 12px 24px; align-content: flex-start; }
      .footer-link { color: rgba(255,255,255,0.75); font-size: 0.92rem; font-weight: 600; }
      .footer-link:hover { color: #fff; }
      .footer-bottom {
        border-top: 1px solid rgba(255,255,255,0.12);
        padding: 18px 24px;
        max-width: 1240px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
        font-size: 0.82rem;
        color: rgba(255,255,255,0.55);
      }

      @media (max-width: 640px) {
        .section { padding: 48px 0; }
        .section-inner { padding: 0 18px; }
        .header-inner { padding: 10px 16px; }
        .detail-title { font-size: 1.5rem; }
      }
    `}</style>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
